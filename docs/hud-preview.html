<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#000;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-family:Helvetica,Arial,sans-serif;padding:16px;box-sizing:border-box}
.row{display:flex;gap:22px;align-items:flex-start}
.rowlabel{color:#2aa046;font-size:11px;letter-spacing:2px}
.hud{width:280px;height:280px;background:#0a0f0b;border-radius:18px;padding:16px 18px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between;color:#40FF5E}
.head{display:flex;justify-content:space-between;align-items:center}
.brand{font-weight:bold;letter-spacing:1px;font-size:14px}
.chip{background:#40FF5E;color:#123a1d;padding:3px 10px;border-radius:999px;font-size:10px;font-weight:bold;letter-spacing:1px}
.chip.dim{background:transparent;color:#2aa046;border:1px solid #2aa046}
.body{flex:1;display:flex;align-items:center;gap:12px}
.answer{font-size:17px;line-height:25px}
.dot{width:12px;height:12px;border-radius:50%;background:#40FF5E;animation:pulse 1.1s infinite;flex:0 0 auto}
.foot{display:flex;flex-direction:column;align-items:center}
.hint{color:#2aa046;font-size:11px;text-align:center}
.cap{color:#2aa046;text-align:center;margin-top:8px;font-size:11px}
.col{display:flex;flex-direction:column}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(64,255,94,.5)}50%{opacity:.55;box-shadow:0 0 0 9px rgba(64,255,94,0)}}
</style></head><body>
<div class="row">
<div class="col"><div class="hud"><div class="head"><div class="brand">◈ HERMES</div><div class="chip dim">就绪</div></div><div class="body"><div class="answer">轻按眼镜腿开始对话</div></div><div class="foot"><div class="hint">眼镜腿 tap = 开始 · 说「退出」结束</div></div></div><div class="cap">中文 · 就绪</div></div>
<div class="col"><div class="hud"><div class="head"><div class="brand">◈ HERMES</div><div class="chip">聆听中</div></div><div class="body"><div class="dot"></div><div class="answer">请讲…</div></div><div class="foot"><div class="hint">正在听 · 说完即可</div></div></div><div class="cap">中文 · 聆听中</div></div>
</div>
<div class="row">
<div class="col"><div class="hud"><div class="head"><div class="brand">◈ HERMES</div><div class="chip dim">READY</div></div><div class="body"><div class="answer">Tap the temple to start</div></div><div class="foot"><div class="hint">temple tap = start · say "exit" to stop</div></div></div><div class="cap">English · ready</div></div>
<div class="col"><div class="hud"><div class="head"><div class="brand">◈ HERMES</div><div class="chip">LISTENING</div></div><div class="body"><div class="dot"></div><div class="answer">Your turn…</div></div><div class="foot"><div class="hint">listening · just speak</div></div></div><div class="cap">English · listening</div></div>
</div>
</body></html>

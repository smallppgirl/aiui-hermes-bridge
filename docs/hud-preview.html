<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#000;height:100vh;display:flex;gap:26px;align-items:center;justify-content:center;font-family:Helvetica,Arial,sans-serif}
.hud{width:300px;height:300px;background:#0a0f0b;border-radius:18px;padding:18px 20px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between;color:#40FF5E}
.head{display:flex;justify-content:space-between;align-items:center}
.brand{font-weight:bold;letter-spacing:1px;font-size:15px}
.chip{background:#40FF5E;color:#123a1d;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:bold;letter-spacing:1px}
.body{flex:1;display:flex;align-items:center}
.answer{font-size:18px;line-height:26px}
.foot{display:flex;flex-direction:column;align-items:center}
.talk{border-radius:999px;padding:8px 24px;font-size:14px;border:1px solid #40ff5d55;color:#40FF5E}
.talk.listening{border:2px solid #40FF5E;box-shadow:0 0 0 9px rgba(64,255,94,.13)}
.hint{color:#2aa046;font-size:11px;margin-top:9px}
.cap{color:#2aa046;text-align:center;margin-top:10px;font-size:11px}
.col{display:flex;flex-direction:column}
</style></head><body>
<div class="col">
<div class="hud">
<div class="head"><div class="brand">◈ HERMES</div><div class="chip">聆听中</div></div>
<div class="body"><div class="answer">请讲…</div></div>
<div class="foot"><div class="talk listening">说话</div><div class="hint">正在听 · 说完即可</div></div>
</div>
<div class="cap">中文（跟随系统 zh-CN）</div>
</div>
<div class="col">
<div class="hud">
<div class="head"><div class="brand">◈ HERMES</div><div class="chip">LISTENING</div></div>
<div class="body"><div class="answer">Your turn…</div></div>
<div class="foot"><div class="talk listening">Talk</div><div class="hint">listening · just speak</div></div>
</div>
<div class="cap">English (follows en-US)</div>
</div>
</body></html>
